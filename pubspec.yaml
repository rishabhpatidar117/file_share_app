name: swiftshare
description: "SwiftShare - high-speed local file transfer between nearby devices."
publish_to: 'none'
version: 1.0.3+4
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  crypto: ^3.0.6
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  multicast_dns: ^0.3.2+7
  window_manager: ^0.4.3
  share_handler: ^0.0.21
  flutter_local_notifications: ^19.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
