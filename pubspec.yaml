name: swiftshare
description: "SwiftShare - high-speed local file transfer between nearby devices."
publish_to: "none"
version: 1.0.7+8
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  crypto: ^3.0.6
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  multicast_dns: ^0.3.2+7
  window_manager: ^0.4.3
  share_handler: ^0.0.21
  flutter_local_notifications: ^19.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  device_info_plus: ^11.3.0
  open_file: ^3.5.4
  win32_registry: ^2.1.0
  ffi: ^2.1.3
  camera: ^0.11.2+1
  path: ^1.9.1
  camera_desktop: ^1.2.1
  saf: ^2.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/app_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/app_logo.png"
